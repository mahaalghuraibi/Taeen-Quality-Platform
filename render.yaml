# Render Blueprint — adjust service name / region / plan as needed.
# Docs: https://render.com/docs/blueprint-spec
#
# Set DATABASE_URL, SECRET_KEY, SEED_ADMIN_EMAIL, SEED_ADMIN_PASSWORD,
# DISH_MEDIA_DIR (persistent disk path), and AI keys in the Render dashboard.

services:
  - type: web
    name: taeen-quality-platform
    runtime: python
    rootDir: backend
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: bash scripts/start_render.sh
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: CORS_ALLOW_ORIGINS
        value: https://taeen-quality-frontend.onrender.com
      - key: ALLOWED_HOSTS
        value: taeen-quality-platform.onrender.com,taeen-backend.onrender.com
      - key: YOLO_AUTO_DOWNLOAD
        value: "true"
      - key: YOLO_ENABLED
        value: "true"
      - key: YOLO_MAX_EDGE
        value: "640"
      - key: YOLO_USE_PERSON_DETECTOR
        value: "false"
      - key: SEED_ADMIN_EMAIL
        value: xmha2000@outlook.com

  - type: web
    name: taeen-quality-frontend
    runtime: static
    rootDir: frontend
    autoDeploy: true
    buildCommand: npm ci && npm run build && rm -f dist/404.html
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_BASE_URL
        value: https://taeen-quality-platform.onrender.com
    routes:
      - type: rewrite
        source: /login
        destination: /index.html
      - type: rewrite
        source: /signup
        destination: /index.html
      - type: rewrite
        source: /register
        destination: /index.html
      - type: rewrite
        source: /dashboard
        destination: /index.html
      - type: rewrite
        source: /dashboard/*
        destination: /index.html
      - type: rewrite
        source: /cameras
        destination: /index.html
      - type: rewrite
        source: /cameras/*
        destination: /index.html
      - type: rewrite
        source: /reports
        destination: /index.html
      - type: rewrite
        source: /reports/*
        destination: /index.html
      - type: rewrite
        source: /alerts
        destination: /index.html
      - type: rewrite
        source: /alerts/*
        destination: /index.html
      - type: rewrite
        source: /analytics
        destination: /index.html
      - type: rewrite
        source: /settings
        destination: /index.html
      - type: rewrite
        source: /admin/*
        destination: /index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
