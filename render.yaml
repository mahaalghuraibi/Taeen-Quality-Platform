# Render Blueprint — adjust service name / region / plan as needed.
# Docs: https://render.com/docs/blueprint-spec
#
# Set DATABASE_URL, SECRET_KEY, CORS_ALLOW_ORIGINS, SEED_ADMIN_EMAIL, SEED_ADMIN_PASSWORD,
# DISH_MEDIA_DIR (persistent disk path), and AI keys in the Render dashboard.
# YOLO PPE weights (hansung_ppe.pt): runtime download on first analyze-frame (YOLO_AUTO_DOWNLOAD).
# mask_best.pt / glove_best.pt / hairnet_best.pt are NOT in git — upload to persistent disk or train locally.

services:
  - type: web
    name: taeen-backend
    runtime: python
    rootDir: backend
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: bash scripts/start_render.sh
    preDeployCommand: python scripts/create_admin.py
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: YOLO_AUTO_DOWNLOAD
        value: "true"
      - key: YOLO_ENABLED
        value: "true"
      - key: YOLO_MAX_EDGE
        value: "640"
      - key: YOLO_USE_PERSON_DETECTOR
        value: "false"

  # Static SPA — auto-deploys on every push to main.
  - type: web
    name: taeen-quality-frontend
    runtime: static
    rootDir: frontend
    autoDeploy: true
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_BASE_URL
        value: https://taeen-quality-platform.onrender.com
    routes:
      # SPA fallback — React Router (history API). Render serves real files first;
      # these rewrites apply only when no static asset exists at the path.
      # Explicit paths help when blueprint rules need re-sync; /* is the catch-all.
      - type: rewrite
        source: /login
        destination: /index.html
      - type: rewrite
        source: /signup
        destination: /index.html
      - type: rewrite
        source: /register
        destination: /index.html
      - type: rewrite
        source: /dashboard
        destination: /index.html
      - type: rewrite
        source: /dashboard/*
        destination: /index.html
      - type: rewrite
        source: /cameras
        destination: /index.html
      - type: rewrite
        source: /cameras/*
        destination: /index.html
      - type: rewrite
        source: /reports
        destination: /index.html
      - type: rewrite
        source: /reports/*
        destination: /index.html
      - type: rewrite
        source: /alerts
        destination: /index.html
      - type: rewrite
        source: /alerts/*
        destination: /index.html
      - type: rewrite
        source: /analytics
        destination: /index.html
      - type: rewrite
        source: /settings
        destination: /index.html
      - type: rewrite
        source: /admin/*
        destination: /index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
