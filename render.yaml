# Render Blueprint — adjust service name / region / plan as needed.
# Docs: https://render.com/docs/blueprint-spec
#
# Set DATABASE_URL, SECRET_KEY, CORS_ALLOW_ORIGINS, SEED_ADMIN_EMAIL, SEED_ADMIN_PASSWORD,
# DISH_MEDIA_DIR (persistent disk path), and AI keys in the Render dashboard.
# YOLO PPE weights (hansung_ppe.pt): runtime download on first analyze-frame (YOLO_AUTO_DOWNLOAD).
# mask_best.pt / glove_best.pt / hairnet_best.pt are NOT in git — upload to persistent disk or train locally.

services:
  - type: web
    name: taeen-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash scripts/start_render.sh
    preDeployCommand: python scripts/create_admin.py
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: YOLO_AUTO_DOWNLOAD
        value: "true"
      - key: YOLO_ENABLED
        value: "true"
      - key: YOLO_MAX_EDGE
        value: "640"
      - key: YOLO_USE_PERSON_DETECTOR
        value: "false"
